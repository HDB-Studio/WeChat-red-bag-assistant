plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.monkeytong.hongbao'
    compileSdk 34

    defaultConfig {
        applicationId "xyz.monkeytong.hongbao"
        minSdk 21
        targetSdk 34
        versionCode 15
        versionName "v6.6.1"
    }

    signingConfigs {
        release {
            storeFile file("../liaoszhongwei-release.jks")
            storePassword project.hasProperty("KEYSTORE_PASS") ? KEYSTORE_PASS : "liaoszhongwei"
            keyAlias project.hasProperty("ALIAS_NAME") ? ALIAS_NAME : "liaoszhongwei"
            keyPassword project.hasProperty("ALIAS_PASS") ? ALIAS_PASS : "liaoszhongwei"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
